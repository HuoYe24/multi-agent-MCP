services:
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    ports:
      - "16686:16686"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  mcp-server:
    build:
      context: .
      dockerfile: project/Dockerfile
    command: python ${MCP_SERVER_SCRIPT:-mcp_server_app.py}
    working_dir: /app/project
    ports:
      - "8765:8765"
    environment:
      - MCP_SERVER_HOST=0.0.0.0
      - MCP_SERVER_PORT=8765
      - REDIS_URL=redis://redis:6379/0
      - OTEL_ENABLED=true
      - OTEL_SERVICE_NAME=multi-agent-mcp-tools
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
    depends_on:
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started

  app:
    build:
      context: .
      dockerfile: project/Dockerfile
    ports:
      - "7860:7860"
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=7860
      - APP_AUTO_RELOAD=false
      - LLM_MODEL=${LLM_MODEL:-qwen-max-0919}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - DENSE_MODEL=${DENSE_MODEL:-nomic-embed-text}
      - SPARSE_MODEL=${SPARSE_MODEL:-none}
      - RERANKER_TYPE=${RERANKER_TYPE:-none}
      - REDIS_URL=redis://redis:6379/0
      - MCP_SERVER_URL=http://mcp-server:8765/mcp
      - MCP_TRANSPORT=${MCP_TRANSPORT:-http}
      - MCP_USE_LANGCHAIN_TOOLS=${MCP_USE_LANGCHAIN_TOOLS:-true}
      - OTEL_ENABLED=true
      - OTEL_SERVICE_NAME=multi-agent-mcp-app
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318/v1/traces
      - OLLAMA_HOST=http://host.docker.internal:11434
      - GRAPH_RAG_ENABLED=${GRAPH_RAG_ENABLED:-true}
      - GRAPH_RAG_MAX_RESULTS=${GRAPH_RAG_MAX_RESULTS:-8}
    volumes:
      - app_data:/app/data
      - qdrant_data:/app/qdrant_db
    depends_on:
      redis:
        condition: service_healthy
      mcp-server:
        condition: service_started
      jaeger:
        condition: service_started

volumes:
  redis_data:
  app_data:
  qdrant_data:
